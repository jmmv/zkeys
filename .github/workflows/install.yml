name: install

on: push

jobs:
    install-freebsd:
        runs-on: ubuntu-latest
        env:
            RUSTC_WRAPPER: "sccache"
            SCCACHE_GHA_ENABLED: "true"
        steps:
            - uses: actions/checkout@v6
            - uses: mozilla-actions/sccache-action@v0.0.9
            - name: Install mtree
              run: |
                  sudo apt update
                  sudo apt install --yes mtree-netbsd
            - name: Install for FreeBSD
              env:
                  PREFIX: ${{ runner.temp }}/zkeys-prefix
                  ZKEYS_TEST_INSTALL_FLAVOR: freebsd
              run: |
                  make PREFIX="${PREFIX}"
                  make install PREFIX="${PREFIX}"
                  mtree -f freebsd/install.mtree -p "${PREFIX}"
            - name: Install for FreeBSD with DESTDIR
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-prefix
                  ZKEYS_TEST_INSTALL_FLAVOR: freebsd
              run: |
                  make
                  make install DESTDIR="${DESTDIR}"
                  mtree -f freebsd/install.mtree -p "${DESTDIR}/usr/local"

    install-linux:
        runs-on: ubuntu-latest
        env:
            RUSTC_WRAPPER: "sccache"
            SCCACHE_GHA_ENABLED: "true"
        steps:
            - uses: actions/checkout@v6
            - uses: mozilla-actions/sccache-action@v0.0.9
            - name: Install mtree
              run: |
                  sudo apt update
                  sudo apt install --yes mtree-netbsd
            - name: Install for Linux
              env:
                  PREFIX: ${{ runner.temp }}/zkeys-prefix
                  ZKEYS_TEST_INSTALL_FLAVOR: linux
              run: |
                  make PREFIX="${PREFIX}"
                  make install PREFIX="${PREFIX}"
                  mtree -f linux/install.mtree -p "${PREFIX}"
            - name: Install for Linux with DESTDIR
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
                  ZKEYS_TEST_INSTALL_FLAVOR: linux
              run: |
                  make
                  make install DESTDIR="${DESTDIR}"
                  mtree -f linux/install.mtree -p "${DESTDIR}"
            - name: Post-install setup
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
              run: |
                  test ! -e "${DESTDIR}/etc/zkeys.toml"
                  test ! -e "${DESTDIR}/usr/lib/dracut/modules.d/50zkeys"
                  "${DESTDIR}/usr/local/libexec/zkeys/setup.sh"
                  test -f "${DESTDIR}/etc/zkeys.toml"
                  test "$(readlink "${DESTDIR}/usr/lib/dracut/modules.d/50zkeys")" = "/usr/local/lib/dracut/modules.d/50zkeys"
            - name: Verify systemd unit
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
              run: systemd-analyze verify --man=no --recursive-errors=no --root="${DESTDIR}" /usr/local/lib/systemd/system/zkeys-keep-alive.service
