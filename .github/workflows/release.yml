# Copyright 2025 Julio Merino

name: release

on: push

jobs:
    distcheck:
        strategy:
            matrix:
                platform: [freebsd, linux]
        runs-on: ubuntu-latest
        env:
            RUSTC_WRAPPER: "sccache"
            SCCACHE_GHA_ENABLED: "true"
        steps:
            - uses: actions/checkout@v6
            - uses: mozilla-actions/sccache-action@v0.0.9
            - name: Install mtree
              run: |
                  sudo apt update
                  sudo apt install --yes mtree-netbsd
            - run: autoreconf -is
            - name: Configure for ${{ matrix.platform }}
              run: |
                  mkdir build
                  cd build
                  ../configure --with-platform=${{ matrix.platform }}
            - name: Distribution check for ${{ matrix.platform }}
              run: make -C build distcheck
            - name: Save source archive
              if: matrix.platform == 'linux'
              uses: actions/upload-artifact@v7
              with:
                  name: zkeys-source
                  path: build/zkeys-*.tar.gz
                  retention-days: 1

    linux-setup:
        runs-on: ubuntu-latest
        env:
            RUSTC_WRAPPER: "sccache"
            SCCACHE_GHA_ENABLED: "true"
        steps:
            - uses: actions/checkout@v6
            - uses: mozilla-actions/sccache-action@v0.0.9
            - name: Install mtree
              run: |
                  sudo apt update
                  sudo apt install --yes mtree-netbsd
            - run: autoreconf -is
            - name: Install for Linux with DESTDIR
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
              run: |
                  mkdir build
                  cd build
                  ../configure --with-platform=linux
                  make
                  make install DESTDIR="${DESTDIR}"
            - name: Post-install setup
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
              run: |
                  test ! -e "${DESTDIR}/etc/zkeys.toml"
                  test ! -e "${DESTDIR}/usr/lib/dracut/modules.d/50zkeys"
                  "${DESTDIR}/usr/local/libexec/zkeys/setup.sh"
                  test -f "${DESTDIR}/etc/zkeys.toml"
                  test "$(readlink "${DESTDIR}/usr/lib/dracut/modules.d/50zkeys")" = "/usr/local/lib/dracut/modules.d/50zkeys"
            - name: Verify systemd unit
              env:
                  DESTDIR: ${{ runner.temp }}/zkeys-destdir
              run: systemd-analyze verify --man=no --recursive-errors=no --root="${DESTDIR}" /usr/local/lib/systemd/system/zkeys-keep-alive.service

    publish:
        if: startsWith(github.ref, 'refs/tags/zkeys-')
        needs: [distcheck, linux-setup]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - name: Generate release notes
              id: release
              run: |
                  echo "version=${GITHUB_REF_NAME#zkeys-}" >>"${GITHUB_OUTPUT}"
                  admin/release-notes.sh >notes.md
            - name: Fetch source archive
              uses: actions/download-artifact@v8
              with:
                  name: zkeys-source
                  path: artifacts
            - name: Publish release
              uses: ncipollo/release-action@v1
              with:
                  allowUpdates: true
                  replacesArtifacts: false
                  name: zkeys ${{ steps.release.outputs.version }}
                  bodyFile: notes.md
                  draft: false
                  prerelease: false
                  artifacts: artifacts/zkeys-*.tar.gz
                  artifactContentType: application/gzip
                  token: ${{ secrets.GITHUB_TOKEN }}
